<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krutika's Art</title>
  <style>

* {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a; 
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(26, 26, 46, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .back-button:hover {
      color: #ff4b5c;
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    /* Hero Banner / Header */
    .hero {
      background-color: #1a1a2e; 
      border-radius: 12px;
      padding: 2.5rem;
      margin-bottom: 2.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hero h1 {
      font-size: 2.2rem;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }

    .hero p {
      color: #cbd5e1;
      font-size: 1.1rem;
      max-width: 700px;
    }

    /* Content Layout Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    /* Project / Feature Cards */
    .card {
      background-color: #1a1a2e;
      border-radius: 12px;
      padding: 1.75rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .card h3 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    .card p {
      color: #cbd5e1;
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }

    /* Tag Chips */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .tag {
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
    }

    /* Action Links & Buttons */
    .btn {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      background-color: #3b82f6; 
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.9;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem;
      color: #64748b;
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="/" class="back-button">
        &#8592; Back to 3D Room
      </a>
      <span class="page-title">Creative Projects</span>
    </nav>
  </header>

  <!-- Main Content Area -->
  <main>

    <!-- Page Banner -->
    <section class="hero">
      <h1>Creative Projects</h1>
      <p>
        A collection of my creative projects!
      </p>
    </section>

    <!-- Project Cards Grid -->
    <section class="grid">

      <!-- Card 1 -->
      <article class="card">
        <h3>Art 1</h3>
        <p>
          filler
        </p>
        <div class="tags">
          <span class="tag">skill1</span>
          <span class="tag">skill2</span>
          <span class="tag">skill3</span>
        </div>
        <a href="#" class="btn">View Source</a>
      </article>

      <!-- Card 2 -->
      <article class="card">
        <h3>Art 2</h3>
        <p>
          filler
        </p>
        <div class="tags">
          <span class="tag">skill1</span>
          <span class="tag">skill2</span>
          <span class="tag">skill3</span>
        </div>
        <a href="#" class="btn">View Project</a>
      </article>

    </section>

  </main>

  <!-- Footer -->
  <footer>
    &copy; Personal Portfolio. Built with React & Three.js.
  </footer>

</body>
</html>
